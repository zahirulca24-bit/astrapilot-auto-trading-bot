[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrapilot-backend"
version = "0.2.0"
description = "AstraPilot API foundation, health contracts, and Neon PostgreSQL foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
]

[project.scripts]
astrapilot-db = "app.db.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.7,<1.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.db", "app.schemas", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
