name: Market Data Gateway

on:
  pull_request:
    paths:
      - 'services/market-data-gateway/**'
      - '.github/workflows/market-data-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'services/market-data-gateway/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-data-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/market-data-gateway/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
